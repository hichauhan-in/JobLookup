# JobLookup defaults.
#
# Do not edit this file — it is replaced when you update. Put your own values in
# config/local.yaml, or change them on the Settings screen, which writes there
# for you. Anything here can also be overridden for one run with an environment
# variable named JOBLOOKUP_<SECTION>_<KEY>, e.g. JOBLOOKUP_SEARCH_RECENCY_DAYS=14.

server:
  host: 127.0.0.1
  port: 8770
  allowed_origins: []
  max_upload_mb: 64
  multi_user: false

paths:
  workspace: workspace
  vendor: vendor

llm:
  # vscode | copilot_cli | openai_compat | anthropic
  provider: vscode
  # Let the app pick the model, how much of each posting to send, and how much
  # the model writes back, all from the economy dial below. Off uses the
  # per-provider model and reasoning settings exactly as written.
  auto: true
  # 0 spends as little as possible, 100 spends whatever it takes. Change it on
  # the Settings screen, where the cost of each position is shown as you drag.
  economy: 50
  json_retries: 2
  max_concurrency: 2

  vscode:
    # Leave blank to read the port and token the extension writes to
    # ~/.joblookup/bridge.json.
    handshake_file: null
    base_url: null
    token: null
    # Blank lets the bridge pick a fast, inexpensive model it can see.
    model: null
    reasoning_effort: null
    context_window_tokens: null
    request_timeout_s: 180

  copilot_cli:
    command: copilot
    extra_args: ["--no-color"]
    model: null
    reasoning_effort: null
    context_window: default
    request_timeout_s: 300

  openai_compat:
    preset: ollama
    base_url: null
    api_key_env: JOBLOOKUP_LLM_API_KEY
    model: llama3.1:8b
    auth_style: bearer
    request_timeout_s: 180
    embed_model: ""

  anthropic:
    base_url: https://api.anthropic.com
    api_key_env: JOBLOOKUP_ANTHROPIC_API_KEY
    model: claude-sonnet-4-5
    max_tokens: 8192
    request_timeout_s: 180

embeddings:
  # Vector recall is used only when the selected provider can produce embeddings
  # for free. Copilot cannot, so with the default setup this quietly stays off
  # and lexical recall is used instead. It never becomes a requirement.
  enabled: true
  model: ""
  dimensions: 0
  batch_size: 32
  timeout_s: 20

search:
  # A thirty-day-old posting is usually already filled.
  recency_days: 7
  max_jobs_per_source: 200
  # Which country pack the Sources screen shows. Codes: in, remote, us, gb, de,
  # nl, fr, ca, au, sg, ae, ie. "remote" also filters results down to roles
  # positively identified as remote. Change it on the Sources screen, not here.
  region: in
  # Off hides the country pack and hands the Sources screen back to manual
  # configuration. Change it with the switch on that screen.
  use_region: true
  min_request_interval_s: 1.0
  http_timeout_s: 30
  max_concurrent_sources: 4
  user_agent: JobLookup/0.1 (personal job search tool)
  min_description_chars: 120
  archive_after_days: 45

tier_b:
  # Master switch for all logged-in browser automation. Every portal is also
  # individually off until you enable it and acknowledge the risk.
  enabled: false
  headless: false
  # Human-paced throttling. Lowering these is what gets accounts restricted.
  min_action_delay_s: 2.5
  max_action_delay_s: 7.0
  max_pages_per_run: 5
  daily_run_cap: 3
  nav_timeout_s: 45

matching:
  recall_mode: auto
  recall_top_k: 300
  recall_min_score: 0.12

  prefilter_enabled: true
  # How many jobs reach the model. Raise it for coverage, lower it to spend
  # less of your Copilot quota.
  prefilter_keep: 120
  max_seniority_jump: 1

  # Jobs judged per model call. 1 is the most accurate and the most expensive.
  score_batch_size: 12
  description_chars: 1800
  rescore_existing: false

  strong_threshold: 0.75
  good_threshold: 0.55
  stretch_threshold: 0.35
  weight_direct: 0.45
  weight_transferable: 0.40
  weight_growth: 0.15

  dedupe:
    title_similarity: 0.88
    require_same_location: true
    description_similarity: 0.92

profile:
  core_skill_threshold: 0.5
  max_skills: 80
  extract_window_chars: 12000

tailor:
  # 0 = say only what the CV already says. Higher lets the model reframe more
  # freely. It may never invent experience at any setting.
  enrichment: 0
  upskilling_heading: Currently upskilling
  include_upskilling_section: true
  style_guard: true
  max_bullets_per_role: 6
  template: ""
  output_format: both

scheduler:
  enabled: false
  hour: 8
  minute: 0
  weekdays: []

logging:
  level: INFO
  file: null
