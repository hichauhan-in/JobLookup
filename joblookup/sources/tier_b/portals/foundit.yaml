# Foundit (formerly Monster India).
#
# WARNING: Automated access is against the terms of service. Disabled until you
# enable it and accept the notice on the Sources screen.

key: foundit
name: Foundit
homepage: https://www.foundit.in
login_url: https://www.foundit.in/seeker/login
description: India and the Gulf; the former Monster network.
page_size: 15

search_url: >-
  https://www.foundit.in/srp/results?query={keywords}&locations={location}&jobFreshness={days}&start={start}

logged_out_markers:
  - "div.login-modal"
  - "input#loginEmail"
  - "a[href*='/seeker/login']"

selectors:
  card: "div.srpResultCard, div.cardContainer"
  title: "div.jobTitle, h3.jobTitle"
  company: "div.companyName, span.company"
  location: "div.details.location, span.locationName"
  summary: "div.jobDescription, div.jdSnippet"
  posted: "span.timeText, div.postedOn"
  link: "a.jobTitleLink, a[href*='/job/']"
